name: Portfolio visual QA and screenshots
on:
  push:
    paths:
      - 'index.html'
      - 'upwork-showcase.html'
      - 'css/style.css'
      - 'js/custom.js'
      - 'scripts/portfolio-smoke.cjs'
      - '.github/workflows/portfolio-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile, and export screenshots
        run: node scripts/portfolio-smoke.cjs
      - name: Publish sanitized portfolio screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase-shots/
          if ! git diff --cached --quiet; then
            git commit -m "Export verified Upwork portfolio preview screenshots"
            git push
          fi
